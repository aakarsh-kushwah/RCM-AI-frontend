<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Direct Selling AI</title>

    <!-- SEO -->
    <meta name="description" content="Official AI Assistant for your Business Network" />

    <!-- PWA -->
    <meta name="theme-color" content="#004c99" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RCM AI" />

    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/rcmai_logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/rcmai_logo.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Performance -->
    <!--
      API origin comes from the same REACT_APP_API_URL the app itself uses
      (Create React App substitutes it at build time), so this can never point
      at a stale host. `crossorigin` is required: the app talks to the API with
      fetch() (a CORS request) and a preconnect without it is never reused.
    -->
    <link rel="preconnect" href="%REACT_APP_API_URL%" crossorigin />
    <!-- Cheap DNS warm-up for the Shorts/Reels feed (YouTube player, thumbnails, channel logos). -->
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://yt3.ggpht.com" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      Razorpay checkout.js is intentionally NOT loaded here.
      PaymentPage.js loads it on demand (only when the payment page opens), so
      it no longer downloads on every route (including /shorts).
    -->

    <!-- Optional: particles.js (see notes: load only where it is used, or remove) -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  </body>
</html>
